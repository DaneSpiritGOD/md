name: Run CI Checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.14.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.14.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type-check
        run: pnpm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.14.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      # The verify gate's browser is downloaded once per Playwright version and
      # restored from cache on every later run.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The config-projection acceptance needs a browser, so it runs here
      # instead of in the fast suite. Blocking: it guards a real regression
      # (an export's article content leaking into the comparison).
      - name: Run browser-gated CLI tests
        env:
          MD_WEB_CLI_BROWSER_TESTS: '1'
        run: pnpm --filter @dane.dai/md-web-cli exec vitest run tests/verify-config.test.ts

      # TEMPORARY: non-blocking while the gate is red on purpose. The difference
      # classes are visible in the log on every change. The transition to
      # blocking is an explicit decision, recorded per
      # docs/adr/0003-single-verify-gate.md ("The gate deliberately landed red").
      - name: Verify rendering (non-blocking)
        continue-on-error: true
        run: pnpm wcli:verify
