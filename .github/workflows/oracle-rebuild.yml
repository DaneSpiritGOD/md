name: Oracle Rebuild

# Tier 3 Oracle rebuild (ticket 06). Manual only — the browser is never part
# of the recurring CI path. Builds the fork's web app, drives Playwright
# against a local server, renders the fixture, and uploads the WeChat-format
# Oracle HTML plus a structural report for human cross-reference.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/setup@v3
        with:
          version: 12.14.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter @md/web build:only

      - name: Rebuild browser Oracle
        run: node scripts/oracle/rebuild-oracle.mjs

      - name: Upload Oracle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-oracle
          path: |
            packages/md-web-cli/oracle/oracle.html
            packages/md-web-cli/oracle/oracle-report.json
          if-no-files-found: error
